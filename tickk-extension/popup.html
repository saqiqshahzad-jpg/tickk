<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380, initial-scale=1.0">
  <title>Tickk</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Loading State -->
  <div id="loading-state" class="state">
    <div class="spinner"></div>
    <p class="loading-text">Loading...</p>
  </div>

  <!-- Auth Required State -->
  <div id="auth-state" class="state" style="display: none;">
    <div class="auth-container">
      <div class="logo-section">
        <div class="logo-icon">✓</div>
        <h1 class="brand">Tickk</h1>
        <p class="tagline">Email Tracking, Simplified.</p>
      </div>
      <button id="login-btn" class="btn btn--primary">
        Sign in to Tickk
      </button>
      <p class="auth-hint">Opens tickk.online in a new tab</p>
    </div>
  </div>

  <!-- Dashboard State -->
  <div id="dashboard-state" class="state" style="display: none;">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo-small">✓</div>
        <span class="brand-small">Tickk</span>
      </div>
      <div class="header-right">
        <span id="credits-badge" class="credits-badge">0</span>
        <button id="settings-btn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <!-- Tracking Toggle -->
    <div class="toggle-section">
      <div class="toggle-info">
        <span class="toggle-label">Email Tracking</span>
        <span id="toggle-status" class="toggle-status">Active</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="tracking-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Recent Emails -->
    <div class="recent-section">
      <h3 class="section-title">Recent Tracked Emails</h3>
      <div id="recent-list" class="recent-list">
        <div class="empty-state">
          <p>No tracked emails yet</p>
        </div>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="footer">
      <button id="dashboard-btn" class="btn btn--outline btn--small">
        Open Dashboard
      </button>
      <button id="logout-btn" class="btn btn--ghost btn--small">
        Logout
      </button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div id="settings-state" class="state" style="display: none;">
    <div class="header">
      <button id="back-btn" class="icon-btn" title="Back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
      </button>
      <span class="brand-small">Settings</span>
      <div></div>
    </div>
    <div class="settings-body">
      <div class="setting-row">
        <span>Track by default</span>
        <label class="toggle">
          <input type="checkbox" id="default-tracking-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Show toast notifications</span>
        <label class="toggle">
          <input type="checkbox" id="toast-toggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
